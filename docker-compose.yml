# ============================================================================
# OpenCNS v2 —— 腾讯云 · 首尔 · 4GB 机器的常驻服务
#
#   docker compose up -d postgres      # 只起数据库
#   docker compose --profile app up -d # 连常驻服务一起起（M2 完成后）
#
# 设计约束：这台机器只有 2 vCPU / 4GB 内存，所以
#   * Postgres 明确限内存，不跟 Ollama 抢；
#   * 端口只绑 127.0.0.1，不对外暴露数据库；
#   * embedding 默认走云 API（server/.env 里 EMBEDDING_PROVIDER=cloud），
#     本地 Ollama 是可选开关——它载入时要 1.5~2GB，这是这台机器最紧的一环。
# ============================================================================

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: opencns-pg
    restart: unless-stopped
    environment:
      POSTGRES_DB: opencns
      POSTGRES_USER: opencns
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 里设置 POSTGRES_PASSWORD}
    command:
      - postgres
      - -c
      - shared_buffers=256MB
      - -c
      - work_mem=8MB
      - -c
      - maintenance_work_mem=128MB
      - -c
      - effective_cache_size=768MB
      - -c
      - max_connections=20
      - -c
      - timezone=Asia/Shanghai
      - -c
      - log_min_duration_statement=500
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ./data/pgdata:/var/lib/postgresql/data
      - ./data/backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opencns -d opencns"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 1200m

  # 常驻认知服务（tick + HTTP + MCP）。M2 完成后启用。
  app:
    profiles: ["app"]
    build:
      context: ./server
    container_name: opencns-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ./server/.env
    environment:
      # 容器内用服务名连库，覆盖 .env 里的 127.0.0.1
      DATABASE_URL: postgresql://opencns:${POSTGRES_PASSWORD}@postgres:5432/opencns
    ports:
      - "127.0.0.1:3000:3000"
    mem_limit: 800m
